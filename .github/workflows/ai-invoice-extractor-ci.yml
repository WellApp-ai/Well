name: AI Invoice Extractor CI

on:
  push:
    paths:
      - 'ai-invoice-extractor/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'ai-invoice-extractor/**'
      - 'shared/**'

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-invoice-extractor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      # Two test runners coexist. The extractor unit tests are written against
      # bun:test and mock modules process-wide, so each file runs in its own
      # process. The CLI and exporter tests run under vitest (see vitest.config.ts
      # for the split).
      - name: Unit tests (bun:test, one process per file)
        run: |
          set -euo pipefail
          for file in src/tests/*.test.ts tests/unit/extractors/*.test.ts tests/unit/utils/*.test.ts tests/integration/*.test.ts; do
            echo "::group::bun test $file"
            bun test "$file"
            echo "::endgroup::"
          done

      - name: CLI and exporter tests (vitest)
        run: bun x vitest run
